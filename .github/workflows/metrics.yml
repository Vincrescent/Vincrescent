name: Update Profile Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # ── Theme ──────────────────────────────────────────────
          config_timezone: Asia/Jakarta
          plugin_base: header, activity, community, repositories, metadata
          config_display: large
          config_animations: true

          # ── Tokyo Ghoul dark palette ───────────────────────────
          config_theme: dark
          config_colors: >-
            0D1117,
            0D1117,
            E50914

          # ── Core stats ─────────────────────────────────────────
          plugin_languages: true
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: O
          plugin_languages_colors: true

          plugin_stargazers: true
          plugin_followup: true

          # ── Activity / streak-style data ───────────────────────
          plugin_isocalendar: true
          plugin_isocalendar_duration: full-year

          plugin_traffic: false   # requires repo admin token; enable if desired

          # ── Habits & code stats ─────────────────────────────────
          plugin_habits: true
          plugin_habits_facts: true
          plugin_habits_charts: true
          plugin_habits_days: 14
          plugin_habits_from: 200

          plugin_lines: true
          plugin_lines_history_limit: 4

          # ── Misc ────────────────────────────────────────────────
          plugin_introduction: true
          plugin_introduction_title: true
