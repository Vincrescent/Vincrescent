<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | vincrescent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #030712;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        .box {
            padding: 3rem 4rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(2, 132, 199, 0.2);
        }
        h1 {
            font-family: 'Montserrat Alternates', sans-serif;
            font-size: 6rem;
            margin: 0;
            color: #38bdf8;
            letter-spacing: -3px;
        }
        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin: 1rem 0 2rem 0;
        }
        a {
            display: inline-block;
            padding: 10px 24px;
            background: #0f172a;
            border: 1.5px solid #38bdf8;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        a:hover {
            background: #38bdf8;
            color: #030712;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <p>This page doesn't exist.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
