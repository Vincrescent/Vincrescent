<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 75" width="100%">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.8"/>
      <circle cx="12" cy="12" r="1.5" fill="#3f3f46" opacity="0.6"/>
    </pattern>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#101014" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#09090b"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <g transform="translate(10, 5)">
    <rect width="180" height="65" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.2"/>
    <!-- Roblox Logo -->
    <rect x="22" y="24" width="20" height="20" rx="3.5" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(-15 32 34)"/>
    <text x="56" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="1">ROBLOX</text>
  </g>
</svg>
