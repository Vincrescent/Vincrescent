<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 75" width="100%">
  <defs>
    <pattern id="cyanDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#0284c7" opacity="0.5"/>
      <circle cx="15" cy="15" r="1.8" fill="#38bdf8" opacity="0.3"/>
    </pattern>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070d19" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#cyanDots)"/>

  <g transform="translate(10, 5)">
    <rect width="180" height="65" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <rect x="22" y="24" width="20" height="20" rx="3.5" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(-15 32 34)"/>
    <text x="56" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="1">ROBLOX</text>
  </g>
</svg>
