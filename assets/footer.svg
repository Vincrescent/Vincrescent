<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%">
  <defs>
    <pattern id="cyanDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#0284c7" opacity="0.5"/>
      <circle cx="15" cy="15" r="1.8" fill="#38bdf8" opacity="0.3"/>
    </pattern>
    <linearGradient id="iceGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#cyanDots)"/>

  <!-- Footer Box -->
  <rect x="40" y="20" width="720" height="175" rx="20" fill="url(#iceGlass)" stroke="url(#cyanBorder)" stroke-width="1.4"/>

  <!-- Text Content (Left Side) -->
  <g transform="translate(80, 56)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#e0f2fe" letter-spacing="-0.3">Loading this README</text>
    <text y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#e0f2fe" letter-spacing="-0.3">probably took you</text>
    <text y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#ffffff" letter-spacing="-0.3">about <tspan fill="#38bdf8" font-weight="900">0.8 MB</tspan> of data.</text>

    <text y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#60a5fa">(The GitHub page itself likely</text>
    <text y="98" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#60a5fa">took <tspan font-weight="700" fill="#38bdf8">3-4 times</tspan> more to load)</text>
  </g>

  <!-- ASCII Cat Graphic (Right Side) -->
  <g transform="translate(560, 48)">
    <text font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#38bdf8" xml:space="preserve">
      <tspan x="0" dy="0">    /\_____/\    </tspan>
      <tspan x="0" dy="16">   /  o   o  \   </tspan>
      <tspan x="0" dy="16">  (  ==  ^  == ) </tspan>
      <tspan x="0" dy="16">   )         (   </tspan>
      <tspan x="0" dy="16">  (  /     \  )  </tspan>
      <tspan x="0" dy="16">  ( (  | |  ) )  </tspan>
      <tspan x="0" dy="16">  (_(__|_|__)_)  </tspan>
    </text>
  </g>

  <!-- Bottom URL -->
  <text x="400" y="222" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-weight="600" font-size="11" fill="#38bdf8" letter-spacing="2">HTTPS://GITHUB.COM/VINCRESCENT</text>
</svg>
