<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <!-- Dot Matrix Pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.8"/>
      <circle cx="12" cy="12" r="1.5" fill="#3f3f46" opacity="0.6"/>
    </pattern>
    <!-- Glass Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e0e11" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#09090b"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- Main Glass Box -->
  <rect x="50" y="40" width="700" height="240" rx="24" fill="url(#glass)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Glow Effect Behind Text -->
  <circle cx="400" cy="140" r="120" fill="#ffffff" opacity="0.03" filter="blur(20px)"/>

  <!-- Content -->
  <g text-anchor="middle">
    <!-- Title -->
    <text x="400" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-3">vincrescent</text>
    
    <!-- Tagline -->
    <text x="400" y="192" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#a1a1aa" letter-spacing="5">ROBLOX DEVELOPER &nbsp;•&nbsp; LUAU MASTER</text>
    
    <!-- Link -->
    <text x="400" y="232" font-family="'Consolas', 'Courier New', monospace" font-weight="500" font-size="11" fill="#52525b" letter-spacing="2">HTTPS://GITHUB.COM/VINCRESCENT</text>
  </g>
</svg>
