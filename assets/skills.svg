<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <defs>
    <pattern id="cyanDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#0284c7" opacity="0.5"/>
      <circle cx="15" cy="15" r="1.8" fill="#38bdf8" opacity="0.3"/>
    </pattern>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070d19" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#cyanDots)"/>

  <!-- Section Title Badge -->
  <rect x="40" y="16" width="96" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="88" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">SKILLS</text>

  <!-- Buttons Grid (2 rows x 4 cols) -->
  
  <!-- Row 1 -->
  <!-- Col 1: LUAU -->
  <g transform="translate(40, 58)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <circle cx="44" cy="37" r="12" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="51" cy="30" r="4" fill="#ffffff"/>
    <text x="74" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="1">LUAU</text>
  </g>

  <!-- Col 2: ROBLOX STUDIO -->
  <g transform="translate(224, 58)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <rect x="30" y="25" width="22" height="22" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(-15 41 36)"/>
    <text x="64" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1">ROBLOX</text>
  </g>

  <!-- Col 3: BLENDER -->
  <g transform="translate(408, 58)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <path d="M 32 44 C 32 36, 44 32, 44 40 C 44 46, 34 48, 32 44 Z M 44 36 L 52 24 M 40 34 L 32 22" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <text x="66" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="1">BLENDER</text>
  </g>

  <!-- Col 4: JAVASCRIPT -->
  <g transform="translate(592, 58)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <rect x="30" y="24" width="24" height="24" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="36" y="43" font-family="sans-serif" font-weight="900" font-size="11" fill="#38bdf8">JS</text>
    <text x="68" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1">JAVASCRIPT</text>
  </g>

  <!-- Row 2 -->
  <!-- Col 1: REACT -->
  <g transform="translate(40, 150)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <ellipse cx="40" cy="37" rx="12" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(30 40 37)"/>
    <ellipse cx="40" cy="37" rx="12" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(90 40 37)"/>
    <ellipse cx="40" cy="37" rx="12" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(150 40 37)"/>
    <circle cx="40" cy="37" r="2.5" fill="#ffffff"/>
    <text x="68" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="1">REACT</text>
  </g>

  <!-- Col 2: TAILWIND -->
  <g transform="translate(224, 150)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <path d="M 30 38 Q 34 30, 40 34 Q 44 38, 48 34 M 26 44 Q 30 36, 36 40 Q 40 44, 44 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1">TAILWIND</text>
  </g>

  <!-- Col 3: WINDOWS -->
  <g transform="translate(408, 150)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <path d="M 30 26 L 41 24 L 41 35 L 30 35 Z M 43 24 L 54 22 L 54 35 L 43 35 Z M 30 37 L 41 37 L 41 48 L 30 46 Z M 43 37 L 54 37 L 54 49 L 43 47 Z" fill="#38bdf8"/>
    <text x="68" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1">WINDOWS</text>
  </g>

  <!-- Col 4: GIT -->
  <g transform="translate(592, 150)">
    <rect width="168" height="74" rx="14" fill="url(#btnGrad)" stroke="url(#btnBorder)" stroke-width="1.4"/>
    <path d="M 44 26 L 36 34 M 36 34 L 36 46 M 36 34 L 44 42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44" cy="26" r="3" fill="#ffffff"/>
    <circle cx="36" cy="46" r="3" fill="#ffffff"/>
    <circle cx="44" cy="42" r="3" fill="#ffffff"/>
    <text x="68" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="1">GIT</text>
  </g>

</svg>
