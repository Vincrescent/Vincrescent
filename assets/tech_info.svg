<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.8"/>
      <circle cx="12" cy="12" r="1.5" fill="#3f3f46" opacity="0.6"/>
    </pattern>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#09090b"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- Section Title Badge -->
  <rect x="50" y="14" width="110" height="28" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="105" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff" letter-spacing="2">TECH. INFO</text>

  <!-- Row 1 -->
  <!-- Pill 1: MAIN FOCUS -->
  <g transform="translate(50, 54)">
    <rect width="130" height="42" rx="10" fill="url(#labelGrad)" stroke="#3f3f46" stroke-width="1"/>
    <text x="65" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#a1a1aa" letter-spacing="1">MAIN FOCUS</text>
    
    <rect x="138" y="0" width="175" height="42" rx="10" fill="url(#valGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="225" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">LUAU &amp; ROBLOX</text>
  </g>

  <!-- Pill 2: PRIMARY OS -->
  <g transform="translate(400, 54)">
    <rect width="140" height="42" rx="10" fill="url(#labelGrad)" stroke="#3f3f46" stroke-width="1"/>
    <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#a1a1aa" letter-spacing="1">PRIMARY OS</text>
    
    <rect x="148" y="0" width="202" height="42" rx="10" fill="url(#valGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="249" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">WINDOWS 11</text>
  </g>

  <!-- Row 2 -->
  <!-- Pill 3: ENGINE -->
  <g transform="translate(50, 110)">
    <rect width="115" height="42" rx="10" fill="url(#labelGrad)" stroke="#3f3f46" stroke-width="1"/>
    <text x="57" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#a1a1aa" letter-spacing="1">ENGINE</text>
    
    <rect x="123" y="0" width="190" height="42" rx="10" fill="url(#valGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="218" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">ROBLOX STUDIO</text>
  </g>

  <!-- Pill 4: 3D SUITE -->
  <g transform="translate(400, 110)">
    <rect width="115" height="42" rx="10" fill="url(#labelGrad)" stroke="#3f3f46" stroke-width="1"/>
    <text x="57" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#a1a1aa" letter-spacing="1">3D SUITE</text>
    
    <rect x="123" y="0" width="227" height="42" rx="10" fill="url(#valGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="236" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">BLENDER 3D</text>
  </g>

</svg>
