<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%">
  <defs>
    <pattern id="cyanDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#0284c7" opacity="0.5"/>
      <circle cx="15" cy="15" r="1.8" fill="#38bdf8" opacity="0.3"/>
    </pattern>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070d19"/>
    </linearGradient>
    <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#cyanDots)"/>

  <!-- Section Title Badge -->
  <rect x="40" y="14" width="116" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="98" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">TECH. INFO</text>

  <!-- Row 1 -->
  <!-- Pill 1: MAIN FOCUS -->
  <g transform="translate(40, 54)">
    <rect width="130" height="42" rx="10" fill="url(#labelGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="65" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="1">MAIN FOCUS</text>
    
    <rect x="138" y="0" width="185" height="42" rx="10" fill="url(#valGrad)" stroke="#0284c7" stroke-width="1"/>
    <text x="230" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">LUAU &amp; ROBLOX</text>
  </g>

  <!-- Pill 2: PRIMARY OS -->
  <g transform="translate(400, 54)">
    <rect width="140" height="42" rx="10" fill="url(#labelGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="1">PRIMARY OS</text>
    
    <rect x="148" y="0" width="212" height="42" rx="10" fill="url(#valGrad)" stroke="#0284c7" stroke-width="1"/>
    <text x="254" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">WINDOWS 11</text>
  </g>

  <!-- Row 2 -->
  <!-- Pill 3: ENGINE -->
  <g transform="translate(40, 110)">
    <rect width="115" height="42" rx="10" fill="url(#labelGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="57" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="1">ENGINE</text>
    
    <rect x="123" y="0" width="200" height="42" rx="10" fill="url(#valGrad)" stroke="#0284c7" stroke-width="1"/>
    <text x="223" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">ROBLOX STUDIO</text>
  </g>

  <!-- Pill 4: 3D SUITE -->
  <g transform="translate(400, 110)">
    <rect width="115" height="42" rx="10" fill="url(#labelGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="57" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="1">3D SUITE</text>
    
    <rect x="123" y="0" width="237" height="42" rx="10" fill="url(#valGrad)" stroke="#0284c7" stroke-width="1"/>
    <text x="241" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">BLENDER 3D</text>
  </g>

</svg>
