<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 45" width="100%">
  <defs>
    <pattern id="cyanDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#0284c7" opacity="0.5"/>
      <circle cx="15" cy="15" r="1.8" fill="#38bdf8" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#cyanDots)"/>

  <!-- GET IN TOUCH Badge -->
  <rect x="40" y="10" width="140" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="110" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">GET IN TOUCH</text>

  <!-- clickable indicator -->
  <text x="760" y="28" text-anchor="end" font-family="'Consolas', monospace" font-weight="500" font-size="11" fill="#60a5fa" letter-spacing="1">clickable ⚡</text>
</svg>
