<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="100%">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.8"/>
      <circle cx="12" cy="12" r="1.5" fill="#3f3f46" opacity="0.6"/>
    </pattern>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#101014" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#09090b"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <g transform="translate(10, 10)">
    <rect width="360" height="130" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>
    
    <!-- Title -->
    <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="-0.5">RBX-UI-Framework</text>

    <!-- Description -->
    <text x="24" y="74" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#a1a1aa">Custom anime-style interface framework,</text>
    <text x="24" y="92" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#a1a1aa">camera systems, and smooth gameplay</text>
    <text x="24" y="110" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#a1a1aa">interaction mechanics.</text>
  </g>
</svg>
